<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="../phone.js"></script>

  <title>Sam | Private Space</title>

  <link rel="stylesheet" href="../style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap"
    rel="stylesheet"
  >


</head>

<body class="app-body" data-contact="Sam">

  <main class="chat-app">

    <!-- Chat header -->

    <header class="chat-header">
      <a
        class="back-button"
        href="../messages.html"
        aria-label="Back to messages"
      >‹</a>

      <div class="chat-avatar avatar-sam" aria-hidden="true" style="overflow:hidden; padding:0; background:#e8dcc8;">
        <img src="../img/sam.png" alt="Sam" style="width:100%;height:100%;object-fit:cover;border-radius:50%;image-rendering:pixelated; display:block;">
      </div>

      <div class="contact-details">
        <div class="contact-name">Sam</div>
        <div class="contact-status online" id="samStatus">online</div>
      </div>

      <div class="header-actions">
        <button class="pill-button small" id="summaryButton" type="button" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 11h7M9 15h7M9 19h4"/></svg>
          Summary
        </button>
        <button class="round-button small" id="rewindButton" type="button" aria-label="Start this chat again" title="Start this chat again">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        </button>
      </div>
    </header>

    <!-- Conversation area -->

    <section
      class="chat-content"
      id="chatContent"
      aria-label="Conversation with Sam"
    >

      <div class="story-label">
        Everything is fictional.
      </div>


      <div class="bubble received">
        Hey, are you free? Something weird just hit the news.
      </div>

      <!-- Everything below stays hidden until the user continues -->

      <div id="unlockedConversation" hidden>
        <!-- Messages are added here as the conversation progresses -->
        <div id="conversationMessages"></div>

        <div
          id="typingIndicator"
          class="bubble received"
          role="status"
          aria-label="Sam is typing"
          hidden
        >
          <span class="typing-dots" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </span>
        </div>

        <div class="date-divider" id="dateDivider" hidden>
        </div>

        <!-- Interactive privacy quiz -->

        <section class="lesson" aria-labelledby="quizHeading">

          <h2 class="lesson-heading" id="quizHeading">
            Detective Challenge
          </h2>

          <p class="lesson-intro">
            Imagine you regularly watch videos about baking and follow several cooking accounts.
          </p>

          <div class="quiz-card">
            <h3 class="quiz-question">
              What could an app predict from this activity?
            </h3>

            <div class="quiz-choices" id="quizChoices">
              <button class="quiz-choice" data-answer="wrong">
                A. Only that you own a phone.
              </button>
              <button class="quiz-choice" data-answer="correct">
                B. That you may be interested in baking.
              </button>
              <button class="quiz-choice" data-answer="wrong">
                C. Nothing, because you never explicitly told the app.
              </button>
            </div>

            <div id="feedback" role="status" aria-live="polite" hidden></div>
          </div>

          <!-- Skipping a question always shows its answer (same in every quiz) -->
          <div id="quizExtraActions" style="display: grid; gap: 10px; margin-top: 16px;">
            <button id="continueQuizButton" class="reply-button primary" type="button" hidden>Continue chatting →</button>
            <button id="showAnswerButton" class="reply-button" type="button">Skip, show me the answer</button>
          </div>

        </section>

        <div class="date-divider" id="finalDateDivider" hidden></div>
        <div id="postQuizMessages"></div>

        <div id="typingIndicatorPost" class="bubble received" role="status" aria-label="Sam is typing" hidden>
          <span class="typing-dots" aria-hidden="true"><span></span><span></span><span></span></span>
        </div>

        <!-- HORSE RACE EMBED - PLAY above image -->
        <div id="horseRaceEmbed" style="display:none; margin:24px 16px 36px; text-align:center;">
          <a class="reply-button game-play" href="../minigames/horse_race.html">▶ Play</a>
          <div style="border-radius:18px; overflow:hidden; background:#78C96E; box-shadow:0 8px 24px rgba(0,0,0,0.12); border:2px solid #e8e8e8;">
            <img src="/img/horse_race.png" alt="Horse Race" style="width:100%; display:block; image-rendering:pixelated; aspect-ratio:16/9; object-fit:cover;" onerror="this.src='../img/horse_race.png'">
          </div>
          <button class="reply-button game-skip" id="skipGameButton" type="button">Skip, show me the summary</button>
        </div>

        <!-- Sam's message after the horse race appears below the game -->
        <div id="afterGameMessages"></div>

      </div>

    </section>

    <!-- Initial response options -->

    <section class="reply-panel" id="replyPanel" aria-label="Choose your reply">

      <div class="reply-options">

        <button
          class="reply-button primary"
          id="continueButton"
          type="button"
        >
          <span>Sure, what is it?</span>
          <span class="arrow" aria-hidden="true">→</span>
        </button>

        <button
          class="reply-button"
          id="summaryRequestButton"
          type="button"
        >
          Just send me the summary
        </button>

        <button
          class="reply-button"
          id="laterButton"
          type="button"
        >
          Not now. Remind me later.
        </button>

      </div>

    </section>

    <div class="home-indicator" aria-hidden="true">
      <span></span>
    </div>

  </main>

  <script src="../tools.js"></script>
  <script>
    const typingIndicator = document.getElementById("typingIndicator");
    const typingIndicatorPost = document.getElementById("typingIndicatorPost");
    const conversationMessages = document.getElementById("conversationMessages");
    const dateDivider = document.getElementById("dateDivider");
    const finalDateDivider = document.getElementById("finalDateDivider");
    const postQuizMessages = document.getElementById("postQuizMessages");
    const afterGameMessages = document.getElementById("afterGameMessages");
    let afterGame = false; // true while Sam reacts to a finished race
    const lesson = document.querySelector(".lesson");

    let conversationStarted = false;
    let waitingForChoice = false;
    let conversationFinished = false;
    const conversationStorageKey = "private-space-sam-conversation";
    let conversationPhase = "initial";
    let finalFollowUpSent = false; // <- moved to top
    let summaryShared = false; // learner asked for the summary at the start
    let gameSkipped = false;
    let quizAnswer = null;     // "correct", "incorrect", or "shown" (skipped)   // learner chose the summary instead of the horse race
    function isPostQuiz() { return finalFollowUpSent || conversationPhase.startsWith("agency"); }


    function readConversationState() {
      try {
        return JSON.parse(sessionStorage.getItem(conversationStorageKey) || "null");
      } catch {
        return null;
      }
    }

    function saveConversationState() {
      const state = readConversationState() || {};
      state.started = conversationStarted;
      state.phase = conversationPhase;
      state.finalFollowUpSent = finalFollowUpSent;
      state.embedVisible = document.getElementById("horseRaceEmbed")?.style.display !== "none";
      // now these actually have children
      state.messages = [...conversationMessages.children].map((m) => ({
        text: m.innerHTML,
        sender: m.classList.contains("sent") ? "sent" : "received"
      }));
      state.postMessages = [...postQuizMessages.children].map((m) => ({
        text: m.innerHTML,
        sender: m.classList.contains("sent") ? "sent" : "received"
      }));
      state.quizAnswer = quizAnswer;
      state.finished = conversationPhase === "agency-done"; // shown as "✓ Finished" in Messages
      state.afterGameMessages = [...afterGameMessages.children].map((m) => ({
        text: m.innerHTML,
        sender: m.classList.contains("sent") ? "sent" : "received"
      }));
      state.summaryShared = summaryShared;
      state.gameSkipped = gameSkipped;
      sessionStorage.setItem(conversationStorageKey, JSON.stringify(state));
    }

    function setConversationPhase(phase) {
      conversationPhase = phase;
      saveConversationState();
    }

    // Keep the quiz hidden until the conversation reaches it.
    lesson.hidden = true;

    // Hide the typing indicator until Sam starts composing a message.
    typingIndicator.hidden = true;

    if (typingIndicatorPost) typingIndicatorPost.hidden = true;

    function wait(milliseconds) {
      return new Promise((resolve) => {
        window.setTimeout(resolve, milliseconds);
      });
    }

    // Keep the latest message and typing indicator visible.
    function scrollToLatest() {
      chatContent.scrollTop = chatContent.scrollHeight;
    }

    // Add a message from Sam or the user.
    function addMessage(text, sender) {
      const message = document.createElement("div");
      message.classList.add("bubble", sender);
      message.innerHTML = text;
      if (afterGame) {
        afterGameMessages.appendChild(message);
      } else if (isPostQuiz() && postQuizMessages) {
        postQuizMessages.appendChild(message);
      } else {
        conversationMessages.appendChild(message);
      }
      saveConversationState(); scrollToLatest(); return message;
    }

    // Update Sam's status and show the animated typing indicator.
    function startTyping() {
      samStatus.textContent = "Sam is typing";
      samStatus.classList.add("typing"); samStatus.classList.remove("online");
      if (isPostQuiz()) {
        typingIndicator.hidden = true;
        typingIndicatorPost.hidden = false;
      } else {
        typingIndicator.hidden = false;
        typingIndicatorPost.hidden = true;
      }
      scrollToLatest();
    }
    function stopTyping() {
      typingIndicator.hidden = true;
      typingIndicatorPost.hidden = true;
      samStatus.textContent = "online";
      samStatus.classList.remove("typing"); samStatus.classList.add("online");
    }

    // Sam types, pauses, and then sends a message.
    async function samReplies(messages, firstDelay = 1200) {
      await wait(600);
      for (let i = 0; i < messages.length; i++) {
        startTyping();

        // Sam takes longer to compose the first reply.
        // Following messages arrive with a shorter pause.
        const delay = i === 0 ? firstDelay : 900;

        await wait(delay);

        stopTyping();
        addMessage(messages[i], "received");

        // Brief pause between messages.
        if (i < messages.length - 1) {
          await wait(400);
        }
      }
    }

    let currentOptions = [];

    // Display choices at the bottom of the screen.
    function showOptions(options) {
      currentOptions = options;
      waitingForChoice = true;
      saveConversationState();

      replyPanel.hidden = false;

      const optionsContainer = replyPanel.querySelector(".reply-options");
      optionsContainer.replaceChildren();

      options.forEach((option, index) => {
        const button = document.createElement("button");

        button.type = "button";
        button.className =
          index === 0
            ? "reply-button primary"
            : "reply-button";

        button.textContent = option.label;

        button.addEventListener("click", () => {
          if (!waitingForChoice) return;
          Tools.snapshot(conversationStorageKey); // saved so "Undo my last reply" can come back here

          waitingForChoice = false;
          replyPanel.hidden = true;

          // Display the user's message only after they select it.
          addMessage(option.label, "sent");

          // Continue the conversation based on their choice.
          option.action();
        });

        optionsContainer.appendChild(button);
      });

      scrollToLatest();

      // Move keyboard focus to the first available reply.
      const firstButton = optionsContainer.querySelector("button");

      if (firstButton) {
        firstButton.focus({ preventScroll: true });
      }
    }

    // First stage: Sam introduces the idea of inferred information.
    async function firstConversationStage() {
      setConversationPhase("first-response");
      await samReplies([
        'I read apps can figure out things about people from their <strong>online activity</strong>.',
        'Like, they might use what you <strong>watch</strong> or <strong>search</strong> for to make predictions about your interests.'
      ]);
      // samReplies() displays the options when Sam finishes.
    }

    // Second stage: the user chooses how to respond.
    function handleFirstResponse() {
      setConversationPhase("first-response");
      showOptions([
        {
          label: "Apps can assume stuff from what I do online?",
          action: explainPredictions
        },
        {
          label: "How can it figure that out?",
          action: explainPatterns
        }
      ]);
    }

    // Explain that online predictions are not necessarily facts.
    async function explainPredictions() {
      setConversationPhase("challenge-options");
      await samReplies([
        "Yep! They're <strong>predictions</strong>, not necessarily facts. But it got me thinking about how much our activity can reveal.",
        "Want to try a little <strong>detective challenge</strong>?"
      ]);

      showChallengeOptions();
    }

    // Give an alternative explanation if the user asks how it works.
    async function explainPatterns() {
      setConversationPhase("challenge-options");
      await samReplies([
        "For example, if you often watch <strong>hiking videos</strong>, an app may predict that you're interested in outdoor activities.",
        "These are predictions based on <strong>patterns</strong>, not necessarily facts.",
        "Want to try a little <strong>detective challenge</strong>?"
      ]);

      showChallengeOptions();
    }

    // Offer a choice before revealing the quiz.
    function showChallengeOptions() {
      setConversationPhase("challenge-options");
      showOptions([
        {
          label: "Sure, let's try!",
          action: openQuiz
        },
        {
          label: "Can you give me an example first?",
          action: giveExample
        }
      ]);
    }

    async function giveExample() {
      setConversationPhase("example-options");
      await samReplies([
        "Imagine you watch lots of baking videos, save cake recipes, and follow baking accounts.",
        "An app might use those patterns to predict that you enjoy baking, even if you never told it directly."
      ]);

      showOptions([
        {
          label: "Okay, let's try the challenge!",
          action: openQuiz
        },
        {
          label: "Not now. Remind me later.",
          action: () => {
            window.location.href = "../messages.html";
          }
        }
      ]);
    }

    async function openQuiz() {
      conversationFinished = true;
      setConversationPhase("quiz");

      await samReplies([
        "Great! Let's see what you can figure out. <strong>Choose the answer that makes the most sense.</strong>"
      ]);

      await wait(2000);

      dateDivider.hidden = false;
      lesson.hidden = false;

      replyPanel.hidden = true;
      scrollToLatest();

      // Put focus on the quiz heading for keyboard accessibility.
      const quizHeading = document.getElementById("quizHeading");
      if (quizHeading) {
        quizHeading.setAttribute("tabindex", "-1");
        quizHeading.focus({ preventScroll: true });
      }

      scrollToLatest();
    }

    // Initial choice: continue or come back later.
    continueButton.addEventListener("click", async () => {
      if (conversationStarted) return;
      Tools.snapshot(conversationStorageKey); // saved so "Undo my last reply" can come back here

      conversationStarted = true;
      setConversationPhase("first-response");

      unlockedConversation.hidden = false;
      replyPanel.hidden = true;

      // Only show the selected reply.
      addMessage(continueButton.querySelector("span").textContent, "sent");

      // Sam starts typing after the user's reply.
      await firstConversationStage();

      // Wait until Sam has finished both messages before offering replies.
      handleFirstResponse();
    });

    // Sam sends the summary as a document, then the chat carries on as usual.
    async function sendSummary(request, reply) {
      addMessage(request, "sent");
      await samReplies([reply, Tools.summaryCardHTML("sam")]);
    }

    function showOpeningOptions() {
      continueButton.querySelector("span").textContent = "Okay, tell me more";
      summaryRequestButton.hidden = true;
      replyPanel.hidden = false;
      continueButton.focus({ preventScroll: true });
    }

    summaryRequestButton.addEventListener("click", async () => {
      if (summaryShared || conversationStarted) return;
      Tools.snapshot(conversationStorageKey); // saved so "Undo my last reply" can come back here
      summaryShared = true;
      replyPanel.hidden = true;
      unlockedConversation.hidden = false;
      await sendSummary("Can you just send me the summary?", "Sure! Here are the main points. Tap to open it.");
      await samReplies(["We can still chat about it, if you want."], 900);
      showOpeningOptions();
    });

    skipGameButton.addEventListener("click", async () => {
      if (gameSkipped) return;
      Tools.snapshot(conversationStorageKey); // saved so "Undo my last reply" can come back here
      gameSkipped = true;
      document.getElementById("horseRaceEmbed").style.display = "none";
      await sendSummary("I'll skip the game. Can I see the summary?", "Of course! Here are the main points.");
      await samReplies(["If you want to play later, rewind the chat with the ↺ button at the top."], 900);
    });

    laterButton.addEventListener("click", () => {
      window.location.href = "../messages.html";
    });

    // Quiz interaction.
    const quizChoices = document.querySelectorAll(".quiz-choice");
    const feedback = document.getElementById("feedback");
    const quizExtraActions = document.getElementById("quizExtraActions");
    const showAnswerButton = document.getElementById("showAnswerButton");

    // A finished quiz stays in the chat, answered, so the right answer can be looked at again.
    function showQuizDone() {
      if (quizExtraActions) quizExtraActions.hidden = true;
    }

    async function sendFinalInsight() {
      if (finalFollowUpSent) return;
      finalFollowUpSent = true;
      if (quizExtraActions) quizExtraActions.hidden = true;
      showQuizDone();

      await wait(1000);
      if (finalDateDivider) {
        finalDateDivider.textContent = "Today";
        finalDateDivider.hidden = false;
      }

      // use addMessage now - it will auto-route to postQuizMessages
      addMessage("That's insightful, thanks!", "sent");
      
      await wait(1000);
      startAgencyTeaching();
    }

    // --- AGENCY: just samReplies + your reply, linear ---

    async function startAgencyTeaching() {
      setConversationPhase("agency-intro");
      await samReplies([
        "We can control what clues we leave. I found 3 quick things that help me."
      ]);
      showOptions([{ label: "Show me", action: teachTip1 }]);
    }

    async function teachTip1() {
      setConversationPhase("agency-tip1");
      await samReplies([
        "1. Check: apps have privacy / history settings. You can see everything they saved about you there.",
      ]);
      showOptions([{ label: "Okay", action: teachTip2 }]);
    }

    async function teachTip2() {
      setConversationPhase("agency-tip2");
      await samReplies([
        "2. Pause / Clear: you can pause watch history or clear searches.",
      ]);
      showOptions([{ label: "Got it", action: teachTip3 }]);
    }

    async function teachTip3() {
      setConversationPhase("agency-tip3");
      await samReplies([
        "3. Incognito: use it when you explore stuff you don't want saved. It doesn't make you invisible, though."
      ]);
      showOptions([{ label: "Makes sense", action: teachWrapUp }]);
    }

    async function teachWrapUp() {
      setConversationPhase("agency-done");
      await samReplies([
        "Try out this game with some questions along the way!",
      ]);
      await wait(700);
      const embed = document.getElementById("horseRaceEmbed");
      if (embed) {
        embed.style.display = "block";
        embed.scrollIntoView({ behavior: "smooth", block: "center" });
        saveConversationState(); // <-- saves embedVisible = true
      }
      showEndOptions();
    }

    // Back from the horse race: Sam sends one last message about it, then the chat ends.
    async function reactToGame() {
      let result = null;
      try { result = sessionStorage.getItem("horse-race-result"); } catch { /* storage unavailable */ }
      if (!result) { showEndOptions(); return; }
      try { sessionStorage.removeItem("horse-race-result"); } catch { /* storage unavailable */ }
      afterGame = true;
      afterGameMessages.after(typingIndicatorPost); // typing dots show below the game too
      await samReplies([result === "won"
        ? "You won the horse race! Those privacy tips are sticking. Thanks for chatting with me!"
        : "You played the horse race! The trackers won this time, but you can play again whenever you want. Thanks for chatting with me!"]);
      showEndOptions();
    }

    // The chat is finished: offer the way back, like at the end of Mum's chat.
    function showEndOptions() {
      const optionsContainer = replyPanel.querySelector(".reply-options");
      const back = document.createElement("a");
      back.className = "back-to-messages";
      back.href = "../messages.html";
      back.textContent = "← Back to all messages";
      optionsContainer.replaceChildren(back);
      replyPanel.hidden = false;
      scrollToLatest();
    }

    // Same pattern as every quiz: answer or skip, see the answer, then "Continue chatting →".
    const continueQuizButton = document.getElementById("continueQuizButton");
    const quizFeedback = {
      correct: "Exactly! Apps can use patterns in your activity to predict your interests, even if you never explicitly tell them.",
      incorrect: "Not quite, and that's okay! The answer is B. Your online activity can give apps clues about your interests.",
      shown: "The answer is B. Apps can use patterns in your activity to predict your interests, even if you never explicitly tell them."
    };
    function showQuizResult(result) {
      quizAnswer = result;
      feedback.hidden = false;
      feedback.textContent = quizFeedback[result];
      quizChoices.forEach((button) => {
        button.disabled = true;
        if (button.dataset.answer === "correct") button.classList.add("correct-answer");
      });
      showAnswerButton.hidden = true;
      continueQuizButton.hidden = finalFollowUpSent;
      if (!finalFollowUpSent) {
        continueQuizButton.focus({ preventScroll: true });
        scrollToLatest(); // bring the answer and "Continue chatting" into view
      }
      saveConversationState();
    }
    showAnswerButton.addEventListener("click", () => { Tools.snapshot(conversationStorageKey); showQuizResult("shown"); });
    quizChoices.forEach((choice) => {
      choice.addEventListener("click", () => {
        Tools.snapshot(conversationStorageKey);
        showQuizResult(choice.dataset.answer === "correct" ? "correct" : "incorrect");
      });
    });
    continueQuizButton.addEventListener("click", sendFinalInsight);

    // Restore the saved conversation and return to the matching choice point.
    function restoreConversation() {
      const state = readConversationState();
      if (state && !state.started && state.summaryShared) {
        summaryShared = true;
        unlockedConversation.hidden = false;
        (state.messages || []).forEach(({ text, sender }) => {
          const m = document.createElement("div");
          m.className = `bubble ${sender === "sent" ? "sent" : "received"}`;
          m.innerHTML = text;
          conversationMessages.appendChild(m);
        });
        showOpeningOptions();
        requestAnimationFrame(scrollToLatest);
        return;
      }
      if (!state || !state.started) return;
      summaryShared = state.summaryShared || false;
      gameSkipped = state.gameSkipped || false;

      conversationStarted = true;
      conversationPhase = state.phase || "first-response";
      finalFollowUpSent = state.finalFollowUpSent || false;
      const embed = document.getElementById("horseRaceEmbed");
      if (state.embedVisible && !gameSkipped && embed) embed.style.display = "block";
      unlockedConversation.hidden = false;
      replyPanel.hidden = true;
      conversationMessages.replaceChildren();
      postQuizMessages.replaceChildren();
      afterGameMessages.replaceChildren();
      (state.afterGameMessages || []).forEach(({ text, sender }) => {
        const m = document.createElement("div");
        m.className = `bubble ${sender === "sent" ? "sent" : "received"}`;
        m.innerHTML = text;
        afterGameMessages.appendChild(m);
      });

      (state.messages || []).forEach(({ text, sender }) => {
        const m = document.createElement("div");
        m.className = `bubble ${sender === "sent" ? "sent" : "received"}`;
        m.innerHTML = text;
        conversationMessages.appendChild(m);
      });
      (state.postMessages || []).forEach(({ text, sender }) => {
        const m = document.createElement("div");
        m.className = `bubble ${sender === "sent" ? "sent" : "received"}`;
        m.innerHTML = text;
        postQuizMessages.appendChild(m);
      });

      if (conversationPhase === "quiz" || conversationPhase.startsWith("agency")) {
        conversationFinished = true;
        dateDivider.hidden = false;
        lesson.hidden = false;
        if (state.quizAnswer) showQuizResult(state.quizAnswer);
        if (finalFollowUpSent) showQuizDone();
        if (finalDateDivider) {
          finalDateDivider.textContent = "Today";
          finalDateDivider.hidden = false;
        }
        // FIX: don't re-send the tip message, just show the next button
        if (conversationPhase === "agency-intro") {
          showOptions([{ label: "Show me", action: teachTip1 }]);
        } else if (conversationPhase === "agency-tip1") {
          showOptions([{ label: "Okay", action: teachTip2 }]);
        } else if (conversationPhase === "agency-tip2") {
          showOptions([{ label: "Got it", action: teachTip3 }]);
        } else if (conversationPhase === "agency-tip3") {
          showOptions([{ label: "Makes sense", action: teachWrapUp }]);
        } else if (conversationPhase === "agency-done") {
          reactToGame();
        }
      } else {
        lesson.hidden = true;
        if (conversationPhase === "challenge-options") showChallengeOptions();
        else if (conversationPhase === "example-options") showExampleOptions();
        else handleFirstResponse();
      }
      requestAnimationFrame(scrollToLatest);
    }
    // Keep the example response's available choices reusable after a return visit.
    function showExampleOptions() {
      setConversationPhase("example-options");
      showOptions([
        { label: "Okay, let's try the challenge!", action: openQuiz },
        { label: "Not now. Remind me later.", action: () => { window.location.href = "../messages.html"; } }
      ]);
    }

    Tools.mountChatHeader({ summary: "sam", storageKey: conversationStorageKey });

    // Sam's message has been read: the home-screen notification goes away.
    try { sessionStorage.setItem("sam-notification-read", "1"); } catch { /* storage unavailable */ }

    restoreConversation();
    // Coming back with the browser's Back button can skip the restore above.
    window.addEventListener("pageshow", (e) => {
      if (e.persisted && conversationPhase === "agency-done") reactToGame();
    });
  </script>
</body>
</html>
