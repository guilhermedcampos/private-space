<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="../phone.js"></script>
<title>Privacy Crossword - Fixed Direction</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:'Nunito',sans-serif;background:#E8DCC8;color:#111;display:flex;justify-content:center;padding:20px}
  .wrap{max-width:1100px;width:100%;display:grid;grid-template-columns:auto 320px;gap:24px}
  @media(max-width:900px){.wrap{grid-template-columns:1fr}}
  .board{background:#fff;border:3px solid #000;border-radius:20px;padding:16px;box-shadow:6px 6px 0 #000}
  .grid{display:grid;gap:3px;background:#000;border:3px solid #000;border-radius:10px;padding:3px;width:fit-content}
  .cell{width:42px;height:42px;background:#fff;position:relative;display:flex;align-items:center;justify-content:center}
  .cell.black{background:#111}
  .cell.locked{background:#B8E6C8}
  .cell.selected{outline:3px solid #7AA8FF;z-index:2}
  .cell input{width:100%;height:100%;border:none;text-align:center;font-size:20px;font-weight:800;text-transform:uppercase;background:transparent;outline:none}
  .cell.locked input{color:#0a5a2a;font-weight:900}
  .num{position:absolute;top:2px;left:3px;font-size:9px;font-weight:800;line-height:1}
  .side{display:flex;flex-direction:column;gap:16px}
  .card{background:#fff;border:3px solid #000;border-radius:18px;padding:14px;box-shadow:5px 5px 0 #000}
  .card h3{margin:0 0 10px;font-size:16px;font-weight:900;text-transform:uppercase}
  .bank{display:flex;flex-wrap:wrap;gap:8px}
  .pill{border:2.5px solid #000;border-radius:999px;padding:5px 12px;font-weight:800;font-size:13px;background:#F7F1E6;display:inline-flex;align-items:center;gap:6px}
  .pill.done{background:#B8E6C8;text-decoration:line-through}
  .clue{padding:6px 8px;border-radius:10px;font-size:14px;line-height:1.3;cursor:pointer}
  .clue:hover{background:#F7F1E6}
  .clue.done{text-decoration:line-through;opacity:0.6;background:#B8E6C8}
  .btns{display:flex;gap:10px;flex-wrap:wrap}
  .btn{border:3px solid #000;border-radius:12px;padding:10px 16px;font-weight:900;cursor:pointer;background:#FFD86E;box-shadow:3px 3px 0 #000}
  .btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
  .btn.secondary{background:#fff}

  /* End pop-up: same look as the horse race's result screen */
  .end-popup{position:fixed;inset:0;z-index:500;background:rgba(255,255,255,.85);backdrop-filter:blur(6px);display:grid;place-items:center;padding:24px}
  .end-popup[hidden]{display:none}
  .end-box{width:100%;max-width:360px;background:#fff;border:4px solid #000;border-radius:26px;padding:24px;box-shadow:0 12px 0 #111;text-align:center}
  .end-icon{width:64px;height:64px;margin:0 auto 12px;border:3px solid #000;border-radius:18px;display:grid;place-items:center;font-size:32px;background:#C8F7C5}
  .answers-shown{margin-top:16px}
  .answers-shown[hidden]{display:none}
  .answers-shown p{margin:0 0 4px;font-weight:900;text-align:center}
  .btns[hidden]{display:none}
  .end-box h2{margin:0;font-size:26px;font-weight:900;line-height:.95;color:#222}
  .end-box p{margin:8px 0 0;font-size:13px;font-weight:700;opacity:.6;color:#222}
  .end-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:20px}
  .end-replay,.end-chat{padding:12px;border:3px solid #000;border-radius:999px;font:900 14px 'Nunito',sans-serif;box-shadow:0 4px 0 #111;cursor:pointer;text-decoration:none;display:grid;place-items:center}
  .end-replay{background:#7ED957;color:#111}
  .end-chat{background:#000;color:#fff}
  .celebration{position:fixed;inset:0;pointer-events:none;z-index:999;overflow:hidden}
  .emoji-drop{position:absolute;top:-40px;font-size:28px;animation:emojiFall linear forwards}
  @keyframes emojiFall{
    0%{transform:translateY(-40px) rotate(0deg); opacity:1}
    100%{transform:translateY(110vh) rotate(360deg); opacity:0}
  }

  /* Inside the phone frame: compact grid; clues and rules move next to the phone */
  html.in-phone body{padding:56px 8px 80px;background:#E8DCC8}
  html.in-phone .wrap{grid-template-columns:1fr}
  html.in-phone .side{display:none}
  html.in-phone .board{padding:8px;border-radius:16px;box-shadow:4px 4px 0 #000}
  html.in-phone .grid{gap:2px;padding:2px;margin:0 auto}
  html.in-phone .cell{width:26px;height:26px}
  html.in-phone .cell input{font-size:15px}
  html.in-phone .num{font-size:7px;top:1px;left:2px}
  html.in-phone .btns{justify-content:center}
</style>
</head>
<body>
<a href="../chats/alex.html" class="text-[13px] font-extrabold px-3 py-1.5 rounded-full bg-white shadow-sm border border-black/10 hover:bg-white transition text-black" style="position:fixed;top:12px;left:12px;z-index:100;font-size:13px;font-weight:800;padding:6px 12px;border-radius:9999px;background:white;box-shadow:0 1px 2px rgba(0,0,0,0.1);border:1px solid rgba(0,0,0,0.1);color:rgb(17,17,17);text-decoration:none;display:inline-flex;align-items:center;">← Alex</a>

<div class="end-popup" id="endPopup" role="dialog" aria-modal="true" aria-labelledby="endTitle" hidden>
  <div class="end-box">
    <div class="end-icon" aria-hidden="true">🏆</div>
    <h2 id="endTitle">You did it!</h2>
    <p>You found all the privacy words!</p>
    <div class="end-actions">
      <button class="end-replay" type="button" onclick="location.reload()">Replay</button>
      <a class="end-chat" href="../chats/alex.html">Chat</a>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="board">
    <div id="grid" class="grid"></div>
    <div class="btns" style="margin-top:16px;">
      <button class="btn secondary" id="revealBtn">Show me the answers</button>
    </div>
    <!-- After "Show me the answers": the answers stay visible, with the same choices as the end pop-up -->
    <div class="answers-shown" id="answersShown" hidden>
      <p>Here are all the answers.</p>
      <div class="end-actions">
        <button class="end-replay" type="button" onclick="location.reload()">Replay</button>
        <a class="end-chat" href="../chats/alex.html">Chat</a>
      </div>
    </div>
  </div>
  <div class="side">
    <div class="card"><h3>Word Bank</h3><div id="bank" class="bank"></div></div>
    <div class="card"><h3>Across</h3><div id="across"></div></div>
    <div class="card"><h3>Down</h3><div id="down"></div></div>
  </div>
</div>

<script>
const WORD_LIST = [
  { word: "PRIVACY",   clue: "Your right to control your personal info" },
  { word: "COOKIES",   clue: "Small files sites save to remember you" },
  { word: "TRACKING",  clue: "Following what you watch or click across apps" },
  { word: "CONSENT",   clue: "Saying yes to data collection" },
  { word: "INCOGNITO", clue: "Mode that doesn't save history on your device" },
  { word: "PASSWORD",  clue: "Secret to protect an account" },
  { word: "PHISHING",  clue: "Fake message trying to steal info" },
  { word: "BREACH",    clue: "When private data leaks out" },
];

const PLACEMENTS = [
  { word: "PRIVACY",   row: 7, col: 5, dir: "across" },
  { word: "TRACKING",  row: 2, col: 7, dir: "down"   },
  { word: "BREACH",    row: 3, col:10, dir: "down"   },
  { word: "PASSWORD",  row: 7, col: 5, dir: "down"   },
  { word: "INCOGNITO", row: 2, col: 0, dir: "across" },
  { word: "PHISHING",  row: 0, col: 0, dir: "down"   },
  { word: "CONSENT",   row: 2, col: 2, dir: "down"   },
  { word: "COOKIES",   row:12, col: 4, dir: "across" },
];

const ROWS = 15, COLS = 12;
let solution = {};
let numberMap = {};
let cellEls = {};
let lockedCells = new Set();
let lockedWords = new Set();
let selected = null;
let currentDir = "down"; // start down so PHISHING column works naturally

function key(r,c){ return r+","+c; }

function buildSolution(){
  for(let p of PLACEMENTS){
    for(let i=0;i<p.word.length;i++){
      let r = p.row + (p.dir==="down"?i:0);
      let c = p.col + (p.dir==="across"?i:0);
      solution[key(r,c)] = p.word[i];
    }
  }
}

function assignNumbers(){
  let starts = {};
  for(let p of PLACEMENTS){
    let k = key(p.row,p.col);
    if(!(k in starts)) starts[k]=true;
  }
  let sorted = Object.keys(starts).sort((a,b)=>{
    let [ra,ca]=a.split(",").map(Number);
    let [rb,cb]=b.split(",").map(Number);
    return ra-rb || ca-cb;
  });
  let n=1;
  for(let k of sorted) numberMap[k]=n++;
}

function createGrid(){
  const gridEl = document.getElementById("grid");
  const size = document.documentElement.classList.contains("in-phone") ? 26 : 42;
  gridEl.style.gridTemplateColumns = `repeat(${COLS}, ${size}px)`;
  gridEl.style.gridTemplateRows = `repeat(${ROWS}, ${size}px)`;
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      let k = key(r,c);
      let div = document.createElement("div");
      div.className = "cell";
      if(!(k in solution)){
        div.classList.add("black");
        gridEl.appendChild(div);
        continue;
      }
      if(numberMap[k]){
        let numEl = document.createElement("div");
        numEl.className = "num";
        numEl.textContent = numberMap[k];
        div.appendChild(numEl);
      }
      let inp = document.createElement("input");
      inp.maxLength = 1;
      inp.dataset.r = r; inp.dataset.c = c;
      inp.addEventListener("input", onInput);
      inp.addEventListener("keydown", onKeyDown);
      inp.addEventListener("focus", ()=>selectCell(r,c,false));
      div.appendChild(inp);
      // Was this square already selected before this click? (Focus happens before "click".)
      let wasSelected = false;
      div.addEventListener("mousedown", ()=>{ wasSelected = !!(selected && selected.r===r && selected.c===c); });
      div.addEventListener("click", ()=>{
        // clicking the same square again toggles direction
        if(wasSelected){ selectCell(r,c,true); return; }
        currentDir = clickDirection(r,c);
        inp.focus();
        selectCell(r,c,false);
      });
      cellEls[k] = {cellDiv:div, input:inp};
      gridEl.appendChild(div);
    }
  }
}

function getPlacementsAt(r,c){
  return PLACEMENTS.filter(p=>{
    if(p.dir==="across") return r===p.row && c>=p.col && c<p.col+p.word.length;
    else return c===p.col && r>=p.row && r<p.row+p.word.length;
  });
}

// A deliberate click on a numbered square starts that square's word, in its direction
// (e.g. 2 starts INCOGNITO across, 3 starts CONSENT down). Elsewhere, if only one unfinished
// word passes through the square, use its direction; otherwise keep the current one.
function clickDirection(r,c){
  const open = getPlacementsAt(r,c).filter(p=>!lockedWords.has(p.word));
  const starts = open.filter(p=>p.row===r && p.col===c);
  if(starts.length===1) return starts[0].dir;
  if(open.length===1) return open[0].dir;
  return currentDir;
}

function selectCell(r,c, toggle){
  if(lockedCells.has(key(r,c))) return;
  let available = getPlacementsAt(r,c).map(p=>p.dir);
  if(toggle && available.length>1){
    currentDir = currentDir==="across"?"down":"across";
    if(!available.includes(currentDir)) currentDir = available[0];
  } else {
    if(available.length>0 && !available.includes(currentDir)){
      currentDir = available[0];
    }
  }
  if(selected){
    let prev = cellEls[key(selected.r,selected.c)];
    if(prev) prev.cellDiv.classList.remove("selected");
  }
  selected = {r,c};
  let cur = cellEls[key(r,c)];
  if(cur) cur.cellDiv.classList.add("selected");
}

function onInput(e){
  let inp = e.target;
  let r = Number(inp.dataset.r), c = Number(inp.dataset.c);
  let k = key(r,c);
  if(lockedCells.has(k)){ inp.value = solution[k]; return; }
  let v = inp.value.toUpperCase().replace(/[^A-Z]/g,"");
  inp.value = v;
  if(v){
    checkWordsAt(r,c);
    moveNext(r,c);
  }
}

// The next square in a direction that can still be typed in: locked squares
// (already part of a finished word) are skipped. Returns null at the end of the word.
function nextOpenCell(r,c,dr,dc){
  let nr = r+dr, nc = c+dc;
  while(cellEls[key(nr,nc)]){
    if(!lockedCells.has(key(nr,nc))) return {r:nr, c:nc};
    nr += dr; nc += dc;
  }
  return null;
}
function goTo(cell){
  if(!cell) return;
  cellEls[key(cell.r,cell.c)].input.focus();
  selectCell(cell.r,cell.c,false);
}

function onKeyDown(e){
  if(e.key==="Backspace" && !e.target.value){
    let r = Number(e.target.dataset.r), c = Number(e.target.dataset.c);
    // move back in currentDir, skipping locked squares
    const prev = nextOpenCell(r,c,currentDir==="down"?-1:0,currentDir==="across"?-1:0);
    if(prev){
      e.preventDefault();
      cellEls[key(prev.r,prev.c)].input.value = "";
      goTo(prev);
    }
  }
  if(e.key==="ArrowRight"){ currentDir="across"; moveDir(0,1); }
  if(e.key==="ArrowLeft"){ currentDir="across"; moveDir(0,-1); }
  if(e.key==="ArrowDown"){ currentDir="down"; moveDir(1,0); }
  if(e.key==="ArrowUp"){ currentDir="down"; moveDir(-1,0); }
}

function moveDir(dr,dc){
  if(!selected) return;
  goTo(nextOpenCell(selected.r,selected.c,dr,dc));
}

function isWordCorrect(p){
  for(let i=0;i<p.word.length;i++){
    let r = p.row + (p.dir==="down"?i:0);
    let c = p.col + (p.dir==="across"?i:0);
    let el = cellEls[key(r,c)];
    if(!el) return false;
    if(el.input.value.toUpperCase() !== p.word[i]) return false;
  }
  return true;
}

function dropCelebration(){
  // create container if not exists
  let container = document.getElementById("celebration");
  if(!container){
    container = document.createElement("div");
    container.id = "celebration";
    container.className = "celebration";
    document.body.appendChild(container);
  }
  container.innerHTML = "";
  const emojis = ["🎉","🎊","🎉","🎊","✨","🎉","🎊"];
  for(let i=0;i<35;i++){
    let span = document.createElement("span");
    span.className = "emoji-drop";
    span.textContent = emojis[i % emojis.length];
    span.style.left = Math.random()*100 + "vw";
    span.style.animationDuration = (1.5 + Math.random()*2) + "s";
    span.style.animationDelay = (Math.random()*0.5) + "s";
    container.appendChild(span);
  }
  // remove after animation
  setTimeout(()=>{ container.innerHTML=""; }, 4000);
}

function checkWordsAt(r,c){
  const before = lockedWords.size;
  for(let p of getPlacementsAt(r,c)){
    if(lockedWords.has(p.word)) continue;
    if(isWordCorrect(p)) lockWord(p);
  }
  playWordSounds(before);
  if(lockedWords.size===PLACEMENTS.length){
    setTimeout(()=>{ dropCelebration(); showEndPopup(); },200);
  }
}

// End pop-up when you find every word, like the horse race's result screen.
function showEndPopup(){
  const pop = document.getElementById("endPopup");
  pop.hidden = false;
  pop.querySelector(".end-replay").focus();
}

// A finished word sparkles; the last word plays the win tune. (Reveal stays silent.)
function playWordSounds(before){
  if(lockedWords.size===before) return;
  Sounds.play(lockedWords.size===PLACEMENTS.length ? "win" : "word");
}

function lockWord(p){
  if(lockedWords.has(p.word)) return;
  lockedWords.add(p.word);
  for(let i=0;i<p.word.length;i++){
    let r = p.row + (p.dir==="down"?i:0);
    let c = p.col + (p.dir==="across"?i:0);
    let k = key(r,c);
    lockedCells.add(k);
    let el = cellEls[k];
    if(el){
      el.cellDiv.classList.add("locked");
      el.input.readOnly = true;
    }
  }
  renderBank(); renderClues(); syncSide();
}

function renderBank(){
  const bankEl = document.getElementById("bank");
  bankEl.innerHTML="";
  let sorted=[...WORD_LIST].sort((a,b)=>a.word.localeCompare(b.word));
  for(let w of sorted){
    let pill=document.createElement("div");
    pill.className="pill"+(lockedWords.has(w.word)?" done":"");
    pill.textContent=w.word+(lockedWords.has(w.word)?" 🔒":"");
    bankEl.appendChild(pill);
  }
}

function renderClues(){
  const acrossEl=document.getElementById("across");
  const downEl=document.getElementById("down");
  acrossEl.innerHTML=""; downEl.innerHTML="";
  for(let p of PLACEMENTS){
    let num=numberMap[key(p.row,p.col)];
    let info=WORD_LIST.find(w=>w.word===p.word);
    let div=document.createElement("div");
    div.className="clue"+(lockedWords.has(p.word)?" done":"");
    div.textContent=`${num}. ${info.clue} (${p.word.length})`;
    div.dataset.sideAction=p.word;
    div.onclick=()=>focusWord(p);
    if(p.dir==="across") acrossEl.appendChild(div); else downEl.appendChild(div);
  }
}

// In the phone frame, mirror the side cards next to the phone.
const SIDE_STYLE = `<style>
  .card{background:#fff;border:3px solid #000;border-radius:18px;padding:14px;box-shadow:5px 5px 0 #000;margin-bottom:16px;font-family:'Nunito',sans-serif}
  .card h3{margin:0 0 10px;font-size:16px;font-weight:900;text-transform:uppercase}
  .bank{display:flex;flex-wrap:wrap;gap:8px}
  .pill{border:2.5px solid #000;border-radius:999px;padding:5px 12px;font-weight:800;font-size:13px;background:#F7F1E6}
  .pill.done{background:#B8E6C8;text-decoration:line-through}
  .clue{padding:6px 8px;border-radius:10px;font-size:14px;line-height:1.3;cursor:pointer}
  .clue:hover{background:#F7F1E6}
  .clue.done{text-decoration:line-through;opacity:0.6;background:#B8E6C8}
</style>`;
function syncSide(){
  if(!window.PhoneShell) return;
  PhoneShell.setSide(SIDE_STYLE + document.querySelector(".side").innerHTML);
}
if(window.PhoneShell){
  PhoneShell.onSideClick(word=>{
    const p=PLACEMENTS.find(x=>x.word===word);
    if(p){ window.focus(); focusWord(p); }
  });
}

function focusWord(p){
  currentDir=p.dir;
  // start at the word's first square that can still be typed in
  const dr = p.dir==="down"?1:0, dc = p.dir==="across"?1:0;
  goTo(lockedCells.has(key(p.row,p.col)) ? nextOpenCell(p.row,p.col,dr,dc) : {r:p.row, c:p.col});
}

function moveNext(r,c){
  // CRITICAL FIX: always continue in currentDir, never auto-switch to other direction at intersection
  // This fixes PHISHING bug where after I at (2,0) it jumped to (2,1) instead of (3,0)
  goTo(nextOpenCell(r,c,currentDir==="down"?1:0,currentDir==="across"?1:0));
}

function revealAll(){
  if(lockedWords.size===PLACEMENTS.length) return;
  for(let k in solution){ let el=cellEls[k]; if(el) el.input.value=solution[k]; }
  for(let p of PLACEMENTS) lockWord(p);
  // Keep the answers visible: swap the buttons for Replay / Chat instead of covering the grid.
  document.querySelector(".btns").hidden = true;
  document.getElementById("answersShown").hidden = false;
}

document.getElementById("revealBtn").onclick=revealAll;

buildSolution(); assignNumbers(); createGrid(); renderBank(); renderClues(); syncSide();
</script>
<script src="../sounds.js"></script>
<script src="game-help.js"></script>
<script>
  GameHelp.mount({
    id: "crossword",
    subtitle: "Fill the grid with privacy words.",
    rules: [
      "Read a clue in the <b>Across</b> or <b>Down</b> list. Click it to jump to its first square.",
      "Type <b>one letter</b> in each square.",
      "A correct word turns <b>green</b> and locks.",
      "Click a square twice to switch between across and down.",
      "The <b>word bank</b> shows all the words you need.",
      "Stuck? Tap <b>Show me the answers</b>. There is no timer."
    ]
  });
</script>
</body>
